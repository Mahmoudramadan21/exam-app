<svg
  width="480"
  height="360"
  viewBox="0 0 480 360"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="error-illustration-title"
>
  <title id="error-illustration-title">Error illustration</title>

  <defs>
    <!-- Background -->
    <linearGradient
      id="error-bg"
      x1="95"
      y1="45"
      x2="391"
      y2="318"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#EFF6FF" />
      <stop offset="1" stop-color="#DBEAFE" />
    </linearGradient>

    <!-- Main object -->
    <linearGradient
      id="error-primary"
      x1="175"
      y1="155"
      x2="313"
      y2="291"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#60A5FA" />
      <stop offset="1" stop-color="#2563EB" />
    </linearGradient>

    <!-- Secondary -->
    <linearGradient
      id="error-secondary"
      x1="206"
      y1="125"
      x2="289"
      y2="201"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#BFDBFE" />
      <stop offset="1" stop-color="#93C5FD" />
    </linearGradient>

    <!-- Soft shadow -->
    <filter
      id="error-shadow"
      x="134"
      y="205"
      width="217"
      height="110"
      filterUnits="userSpaceOnUse"
      color-interpolation-filters="sRGB"
    >
      <feDropShadow
        dx="0"
        dy="10"
        stdDeviation="10"
        flood-color="#1E3A8A"
        flood-opacity="0.14"
      />
    </filter>

    <!-- Small shadow -->
    <filter
      id="error-small-shadow"
      x="287"
      y="119"
      width="89"
      height="91"
      filterUnits="userSpaceOnUse"
      color-interpolation-filters="sRGB"
    >
      <feDropShadow
        dx="0"
        dy="6"
        stdDeviation="6"
        flood-color="#1E3A8A"
        flood-opacity="0.12"
      />
    </filter>
  </defs>

